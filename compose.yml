services:
  agent:
    build:
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ${PWD}/databricks
        target: /workspaces/weather/databricks
      - type: bind
        source: ${PWD}/terraform
        target: /workspaces/weather/terraform
      - type: bind
        source: ${PWD}/AGENTS.md
        target: /workspaces/weather/AGENTS.md
      - type: bind
        source: ${PWD}/Dockerfile
        target: /workspaces/weather/Dockerfile
    command: ["--auto", "/workspaces/weather"]